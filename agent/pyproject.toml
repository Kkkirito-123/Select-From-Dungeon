[project]
name = "select-from-dungeon-agent"
version = "0.1.0"
description = "Stateless Campfire, Scribe, and Main Agent service for SELECT * FROM DUNGEON"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai]==2.28.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.scripts]
dungeon-agent = "dungeon_agents.http.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dungeon_agents*"]

[tool.unittest]
discover = "agent/tests"
