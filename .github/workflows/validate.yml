name: Validate project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run validator regression tests
        run: python3 scripts/test_validate_rules.py
      - name: Validate portable package
        run: python3 scripts/validate-rules.py
      - name: Install Agent service
        run: python3 -m pip install -e agent
      - name: Test Agent service
        run: python3 -m unittest discover -s agent/tests
      - name: Install pnpm
        run: npm install --global pnpm@11.9.0
      - name: Install game dependencies
        working-directory: game
        run: pnpm install --frozen-lockfile
      - name: Run game unit tests
        working-directory: game
        run: pnpm test
      - name: Check game architecture
        working-directory: game
        run: pnpm architecture:check
      - name: Build static game
        working-directory: game
        run: pnpm build
