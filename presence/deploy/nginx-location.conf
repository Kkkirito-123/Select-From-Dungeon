# Place this inside the HTTPS server block that already serves /game/.
location = /game/api/presence {
    proxy_pass http://127.0.0.1:8788/presence;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
}
